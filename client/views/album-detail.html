<!-- VIEW: ALBUM / SINGLES DETAIL (Layer 3) -->
<section id="view-album-detail" class="hidden p-6 md:p-8 pb-44 md:pb-28 space-y-6">
  <div>
    <button
      id="album-back-btn"
      type="button"
      class="inline-flex items-center gap-1.5 h-8 px-3 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 transition-colors"
    >
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span id="album-back-label">BACK</span>
    </button>
  </div>

  <!-- Album Header Studio Panel -->
  <div class="studio-panel p-5 sm:p-6 bg-zinc-900/60 flex flex-col md:flex-row gap-6 items-start md:items-end">
    <div
      id="album-detail-cover-wrap"
      class="group w-44 h-44 sm:w-48 sm:h-48 bg-zinc-950 border border-zinc-700 overflow-hidden shrink-0 flex items-center justify-center relative cursor-pointer"
      title="Click to change album cover art &amp; metadata"
    >
      <img id="album-detail-cover" src="" alt="" class="hidden w-full h-full object-cover" />
      <div id="album-detail-cover-fallback" class="flex flex-col items-center justify-center text-zinc-400">
        <i data-lucide="disc" class="w-10 h-10 mb-1"></i>
        <span class="text-[10px] font-mono">NO COVER</span>
      </div>
      <!-- Hover Overlay to Edit Cover / Metadata directly from the Album Cover -->
      <button
        id="album-cover-edit-btn"
        type="button"
        class="opacity-0 group-hover:opacity-100 transition-opacity absolute inset-0 bg-black/75 backdrop-blur-[2px] flex flex-col items-center justify-center gap-1.5 text-emerald-400 font-mono text-[11px]"
      >
        <i data-lucide="image-plus" class="w-6 h-6"></i>
        <span class="font-semibold tracking-wider">CHANGE COVER</span>
        <span class="text-[9.5px] text-zinc-300">OR AUTO-TAG ALBUM</span>
      </button>
    </div>

    <div class="flex-1 min-w-0 space-y-2">
      <div id="album-detail-badge" class="text-[11px] font-mono uppercase tracking-wider text-emerald-400">
        Layer 3 · Album Release
      </div>
      <h1 id="album-detail-title" class="text-2xl sm:text-4xl font-display font-normal tracking-tight text-zinc-100 break-words leading-tight"></h1>
      <div class="flex flex-wrap items-center gap-2 text-xs font-mono text-zinc-400">
        <button id="album-detail-artist-btn" type="button" class="text-zinc-200 hover:text-emerald-400 hover:underline font-sans font-medium text-sm"></button>
        <span id="album-detail-meta"></span>
      </div>

      <!-- Actions: Play, Shuffle, Star, Edit Cover/Tags, and Overflow [...] Menu -->
      <div class="pt-3 flex flex-wrap items-center gap-2">
        <button
          id="album-play-btn"
          type="button"
          class="h-9 px-4 bg-emerald-400 hover:bg-emerald-300 text-zinc-950 text-xs font-mono font-semibold inline-flex items-center gap-2 transition-colors"
        >
          <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
          <span>PLAY</span>
        </button>

        <button
          id="album-shuffle-btn"
          type="button"
          class="h-9 px-4 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 inline-flex items-center gap-2 transition-colors"
        >
          <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
          <span>SHUFFLE</span>
        </button>

        <button
          id="album-star-btn"
          type="button"
          aria-label="Star or unstar album"
          class="h-9 px-3.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 inline-flex items-center gap-1.5 transition-colors"
        >
          <i data-lucide="star" class="w-3.5 h-3.5"></i>
          <span id="album-star-label">STAR</span>
        </button>

        <button
          id="album-edit-meta-btn"
          type="button"
          title="Change album thumbnail / cover art or auto-tag metadata"
          class="h-9 px-3.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 hover:border-emerald-400 text-xs font-mono text-zinc-200 hover:text-emerald-400 inline-flex items-center gap-1.5 transition-colors"
        >
          <i data-lucide="tags" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span>EDIT COVER / TAGS</span>
        </button>

        <!-- Album Overflow Menu [...] -->
        <div class="relative">
          <button
            id="album-more-btn"
            type="button"
            aria-label="More album actions"
            title="More options"
            class="h-9 w-9 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 hover:text-zinc-100 transition-colors"
          >
            <i data-lucide="more-vertical" class="w-4 h-4"></i>
          </button>

          <div
            id="album-more-menu"
            class="hidden absolute left-0 mt-1 w-52 bg-zinc-900 border border-zinc-700 shadow-2xl z-30 py-1 text-xs font-mono"
          >
            <button id="album-menu-shuffle" type="button" class="w-full px-3.5 py-2 text-left hover:bg-zinc-800 flex items-center gap-2.5 text-zinc-200">
              <i data-lucide="shuffle" class="w-3.5 h-3.5 text-zinc-400"></i>
              <span>Shuffle play</span>
            </button>
            <button id="album-menu-play-next" type="button" class="w-full px-3.5 py-2 text-left hover:bg-zinc-800 flex items-center gap-2.5 text-zinc-200">
              <i data-lucide="list-start" class="w-3.5 h-3.5 text-zinc-400"></i>
              <span>Play next</span>
            </button>
            <button id="album-menu-add-queue" type="button" class="w-full px-3.5 py-2 text-left hover:bg-zinc-800 flex items-center gap-2.5 text-zinc-200">
              <i data-lucide="plus" class="w-3.5 h-3.5 text-zinc-400"></i>
              <span>Add to queue</span>
            </button>
            <button id="album-menu-add-playlist" type="button" class="w-full px-3.5 py-2 text-left hover:bg-zinc-800 flex items-center gap-2.5 text-zinc-200">
              <i data-lucide="list-music" class="w-3.5 h-3.5 text-zinc-400"></i>
              <span>Add to playlist</span>
            </button>
            <div class="my-1 border-t border-zinc-800"></div>
            <button id="album-menu-edit-meta" type="button" class="w-full px-3.5 py-2 text-left hover:bg-zinc-800 flex items-center gap-2.5 text-emerald-400">
              <i data-lucide="tags" class="w-3.5 h-3.5 text-emerald-400"></i>
              <span>Edit cover &amp; tags...</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tracklist -->
  <div id="album-tracks-list" class="studio-panel divide-y divide-zinc-800/60 overflow-hidden"></div>
</section>
