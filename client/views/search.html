<!-- VIEW: SEARCH (Universal Search across Original + Translated/Romaji Titles) -->
<section id="view-search" class="hidden p-6 md:p-8 pb-44 md:pb-28 space-y-6">
  <!-- Section Header -->
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 pb-4 border-b border-zinc-700">
    <div>
      <h1 class="font-display font-normal text-2xl sm:text-3xl tracking-tight text-zinc-100 leading-none">Search</h1>
      <p id="search-summary-label" class="font-mono text-xs text-zinc-400 tracking-wide mt-2">
        Search artists, albums, or tracks across original and translated titles
      </p>
    </div>
  </div>

  <!-- Search Input Bar -->
  <div class="relative">
    <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>
    <input
      id="search-input"
      type="text"
      placeholder="Search artists, albums, tracks... (↑↓ to select, Enter to choose, Esc to exit)"
      aria-label="Search library"
      class="w-full h-12 pl-11 pr-24 bg-zinc-900 border border-zinc-700 focus:border-emerald-400 text-sm text-zinc-100 placeholder-zinc-400 font-sans"
    />
    <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-1.5">
      <button
        id="search-clear-btn"
        type="button"
        title="Clear search"
        class="hidden p-1 text-zinc-400 hover:text-zinc-100"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
      <kbd class="px-1.5 py-0.5 text-[10px] font-mono text-zinc-400 bg-zinc-950 border border-zinc-700">ESC</kbd>
    </div>
  </div>

  <!-- Search Results / Empty State Container -->
  <div id="search-results" class="space-y-8">
    <div class="studio-panel p-12 text-center border border-zinc-800 bg-zinc-900/40">
      <div class="w-10 h-10 mx-auto mb-3 bg-zinc-900 border border-zinc-700 flex items-center justify-center text-zinc-400">
        <i data-lucide="search" class="w-5 h-5"></i>
      </div>
      <h2 class="font-display text-xl text-zinc-100">Search your library</h2>
      <p class="text-xs font-mono text-zinc-400 mt-1">
        Find artists, albums, or tracks across your library
      </p>
      <div class="mt-5 flex items-center justify-center gap-2">
        <button type="button" data-search-nav="artists" class="px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 transition-colors">
          Artists
        </button>
        <button type="button" data-search-nav="albums" class="px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 transition-colors">
          Albums
        </button>
        <button type="button" data-search-nav="songs" class="px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 transition-colors">
          Songs
        </button>
      </div>
    </div>
  </div>
</section>
