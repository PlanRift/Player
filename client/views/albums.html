<!-- VIEW: ALBUMS (Full Album Catalog with LibraryToolbar, SortMenu, Starred Filter & Pagination) -->
<section id="view-albums" class="hidden p-6 md:p-8 pb-44 md:pb-28 space-y-6">
  <!-- Section Header -->
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 pb-4 border-b border-zinc-700">
    <div>
      <h1 class="font-display font-normal text-2xl sm:text-3xl tracking-tight text-zinc-100 leading-none">Albums</h1>
      <p id="albums-count-label" class="font-mono text-xs text-zinc-400 tracking-wide mt-2">Full album catalog</p>
    </div>
  </div>

  <!-- LibraryToolbar -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3 bg-zinc-900/60 border border-zinc-800">
    <div class="relative w-full sm:w-72 md:w-80">
      <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
      <input
        id="albums-filter-input"
        type="text"
        placeholder="Filter albums or artists..."
        aria-label="Filter albums"
        class="w-full h-9 pl-9 pr-8 bg-zinc-900 border border-zinc-700 text-xs text-zinc-100 font-mono placeholder-zinc-400"
      />
      <button
        id="albums-filter-clear"
        type="button"
        title="Clear filter"
        class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-100"
      >
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
      <!-- Sort Dropdown -->
      <div class="relative">
        <button
          id="albums-sort-btn"
          type="button"
          class="inline-flex items-center gap-1.5 h-9 px-3 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200"
        >
          <span id="albums-sort-label">Sort: Recently added</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400"></i>
        </button>
        <div
          id="albums-sort-menu"
          class="hidden absolute right-0 mt-1 w-48 bg-zinc-900 border border-zinc-700 shadow-2xl z-30 py-1 text-xs font-mono"
        >
          <button type="button" data-sort="newest" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between text-zinc-100">
            <span>Recently added</span>
            <i data-lucide="check" class="sort-check w-3.5 h-3.5 text-emerald-400"></i>
          </button>
          <button type="button" data-sort="alphabeticalByName" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between text-zinc-300">
            <span>Title A-Z</span>
            <i data-lucide="check" class="sort-check hidden w-3.5 h-3.5 text-emerald-400"></i>
          </button>
          <button type="button" data-sort="alphabeticalByArtist" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between text-zinc-300">
            <span>Artist A-Z</span>
            <i data-lucide="check" class="sort-check hidden w-3.5 h-3.5 text-emerald-400"></i>
          </button>
          <button type="button" data-sort="frequent" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between text-zinc-300">
            <span>Most played</span>
            <i data-lucide="check" class="sort-check hidden w-3.5 h-3.5 text-emerald-400"></i>
          </button>
          <button type="button" data-sort="recent" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between text-zinc-300">
            <span>Recently played</span>
            <i data-lucide="check" class="sort-check hidden w-3.5 h-3.5 text-emerald-400"></i>
          </button>
        </div>
      </div>

      <!-- Starred Filter Toggle -->
      <button
        id="albums-starred-btn"
        type="button"
        title="Filter Starred Albums"
        aria-pressed="false"
        class="h-9 w-9 border border-zinc-700 bg-zinc-900 hover:bg-zinc-800 flex items-center justify-center text-zinc-400 transition-colors"
      >
        <i data-lucide="star" class="w-4 h-4"></i>
      </button>

      <!-- Reset Button -->
      <button
        id="albums-reset-btn"
        type="button"
        class="hidden h-9 px-2.5 text-xs font-mono text-zinc-400 hover:text-zinc-100 inline-flex items-center gap-1"
      >
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
        <span>RESET</span>
      </button>

      <span id="albums-toolbar-count" class="text-[11px] font-mono text-zinc-400 pl-2 border-l border-zinc-800 whitespace-nowrap">
        36 albums
      </span>
    </div>
  </div>

  <!-- Albums Grid -->
  <div id="albums-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>

  <!-- Pagination -->
  <div id="albums-pagination" class="flex items-center justify-between pt-4 border-t border-zinc-800">
    <button
      id="albums-prev-page"
      type="button"
      disabled
      class="h-8 px-3 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 inline-flex items-center gap-1"
    >
      <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
      <span>PREVIOUS</span>
    </button>
    <span id="albums-page-indicator" class="font-mono text-xs text-zinc-400">PAGE 1</span>
    <button
      id="albums-next-page"
      type="button"
      disabled
      class="h-8 px-3 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 inline-flex items-center gap-1"
    >
      <span>NEXT</span>
      <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
    </button>
  </div>
</section>
