<!-- VIEW: ARTIST DETAIL (Unified DetailHeader, Popular Top-10, Albums/Singles Split, Bio & Similar Artists) -->
<section id="view-artist-detail" class="hidden p-6 md:p-8 pb-44 md:pb-28 space-y-7">
  <div>
    <button
      id="back-to-artists-btn"
      type="button"
      class="inline-flex items-center gap-1.5 h-8 px-3 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 transition-colors"
    >
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>ALL ARTISTS</span>
    </button>
  </div>

  <!-- Unified DetailHeader Banner -->
  <div id="artist-detail-header" class="studio-panel p-5 sm:p-6 flex flex-col gap-5 bg-zinc-900/60">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-5">
      <div class="flex items-center gap-4 sm:gap-5 min-w-0">
        <div class="w-24 h-24 sm:w-28 sm:h-28 bg-zinc-950 border border-zinc-700 shrink-0 overflow-hidden flex items-center justify-center artist-avatar-round shadow-xl">
          <img id="artist-detail-thumb" src="" alt="" class="w-full h-full object-cover" />
        </div>
        <div class="min-w-0">
          <p class="text-[11px] font-mono uppercase tracking-wider text-emerald-400">Artist</p>
          <h1 id="artist-detail-name" class="text-2xl sm:text-4xl font-display text-zinc-100 mt-1 break-words leading-tight"></h1>
          <p id="artist-detail-meta" class="text-xs font-mono text-zinc-400 mt-1.5"></p>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap shrink-0 self-start sm:self-center">
        <button
          id="artist-play-all-btn"
          type="button"
          class="h-9 px-4 bg-emerald-400 hover:bg-emerald-300 text-zinc-950 text-xs font-mono font-semibold inline-flex items-center gap-2 transition-colors"
        >
          <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
          <span>PLAY</span>
        </button>
        <button
          id="artist-shuffle-btn"
          type="button"
          class="h-9 px-4 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 inline-flex items-center gap-2 transition-colors"
        >
          <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
          <span>SHUFFLE</span>
        </button>
        <button
          id="artist-radio-btn"
          type="button"
          title="Start Artist Radio"
          class="h-9 px-3.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 hover:text-emerald-400 inline-flex items-center gap-1.5 transition-colors"
        >
          <i data-lucide="radio" class="w-3.5 h-3.5"></i>
          <span>RADIO</span>
        </button>
        <button
          id="artist-star-btn"
          type="button"
          title="Star / Unstar Artist"
          class="h-9 w-9 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-400 hover:text-zinc-100 transition-colors"
        >
          <i data-lucide="star" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Artist Biography (populated from getArtistInfo2, Wikipedia fallback) -->
    <div id="artist-bio-wrap" class="hidden border-t border-zinc-800/80 pt-4">
      <p id="artist-bio-source" class="text-[10px] font-mono uppercase tracking-wider text-zinc-400 mb-1.5"></p>
      <p id="artist-bio-text" class="text-xs text-zinc-300 leading-relaxed line-clamp-4 max-w-4xl"></p>
    </div>

    <!-- Similar Artists Pills (matched to local library) -->
    <div id="artist-similar-wrap" class="hidden border-t border-zinc-800/80 pt-4 space-y-2">
      <div class="text-[10px] font-mono uppercase tracking-wider text-zinc-400">Similar Artists in Library</div>
      <div id="artist-similar-list" class="flex flex-wrap gap-1.5"></div>
    </div>
  </div>

  <!-- Popular Top-10 Tracks -->
  <div id="artist-popular-wrap" class="hidden space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="font-display text-xl text-zinc-100">Popular</h2>
      <button id="artist-popular-toggle-btn" type="button"
        class="hidden text-xs font-mono text-zinc-400 hover:text-emerald-400">
        SHOW TOP 10
      </button>
    </div>
    <div id="artist-popular-list" class="studio-panel divide-y divide-zinc-800/60 overflow-hidden"></div>
  </div>

  <!-- Artist Releases Grid (Albums 7+ vs Singles & EPs <=6) -->
  <div id="artist-albums-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
</section>
