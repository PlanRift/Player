<!-- VIEW: NOW PLAYING (Dedicated /now-playing Desktop 2-Col + Mobile Fullscreen View) -->
<section id="view-now-playing" class="hidden h-full w-full overflow-hidden">
  <!-- Empty State -->
  <div id="np-empty-state" class="hidden h-full w-full flex flex-col items-center justify-center p-8 text-center">
    <div class="w-14 h-14 bg-zinc-900 border border-zinc-700 flex items-center justify-center mb-4 text-zinc-400">
      <i data-lucide="disc" class="w-7 h-7"></i>
    </div>
    <h2 class="font-display text-2xl text-zinc-100">Nothing Playing</h2>
    <p class="text-xs font-mono text-zinc-400 mt-1.5 max-w-sm">
      Select a track or album from your library to begin playback
    </p>
    <button
      id="np-browse-btn"
      type="button"
      class="mt-5 px-4 py-2 bg-emerald-400 text-zinc-950 text-xs font-mono font-semibold hover:bg-emerald-300 transition-colors"
    >
      Browse Library
    </button>
  </div>

  <!-- Active State -->
  <div id="np-active-state" class="relative h-full w-full overflow-hidden">
    <!-- Ambient wash: blurred cover, full-view, no halo (Century Now Playing) -->
    <div
      id="np-backdrop-art"
      class="absolute -inset-16 bg-cover bg-center scale-110 blur-[80px] opacity-45 pointer-events-none transition-all duration-700"
    ></div>
    <div class="absolute inset-0 bg-zinc-950/35 pointer-events-none"></div>

    <!-- Desktop Layout (>= lg) -->
    <div class="hidden lg:flex relative z-10 h-full w-full overflow-hidden pb-24">
      <!-- Left Column: Large Square Cover & Metadata -->
      <div class="flex-1 flex flex-col items-center justify-center p-6 xl:p-10 relative overflow-hidden">

        <div class="relative z-10 w-full max-w-[min(520px,calc(100dvh-310px))] flex flex-col">
          <div class="relative w-full aspect-square bg-zinc-900 border border-zinc-700 shadow-2xl overflow-hidden flex items-center justify-center">
            <img id="np-cover-img" src="" alt="" class="hidden relative w-full h-full object-cover" />
            <div id="np-cover-fallback" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-400 pointer-events-none">
              <i data-lucide="disc" class="w-16 h-16"></i>
            </div>
          </div>

          <div class="mt-5 flex items-start justify-between gap-4">
            <div class="min-w-0 flex-1">
              <h1 id="np-title" class="text-xl xl:text-2xl font-display text-zinc-100 leading-snug break-words">
                No track selected
              </h1>
              <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5">
                <button
                  id="np-artist-btn"
                  type="button"
                  class="text-sm text-zinc-300 hover:text-emerald-400 transition-colors text-left truncate"
                ></button>
              </div>
              <div class="mt-0.5">
                <button
                  id="np-album-btn"
                  type="button"
                  class="text-xs font-mono text-zinc-400 hover:text-zinc-200 transition-colors text-left truncate"
                ></button>
              </div>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
              <button
                id="np-star-btn"
                type="button"
                title="Star / Unstar Track"
                class="w-9 h-9 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-400 hover:text-zinc-100 transition-colors"
              >
                <i data-lucide="star" class="w-4 h-4"></i>
              </button>
              <button
                id="np-more-btn"
                type="button"
                title="Track Options"
                class="w-9 h-9 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-400 hover:text-zinc-100 transition-colors"
              >
                <i data-lucide="more-vertical" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Queue / Lyrics Tabbed Panel -->
      <div class="w-[300px] xl:w-[340px] 2xl:w-[380px] shrink-0 border-l border-zinc-700 bg-zinc-950 flex flex-col h-full">
        <div class="h-11 px-3 border-b border-zinc-700 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-1">
            <button
              id="np-tab-queue"
              type="button"
              class="px-3 py-1.5 text-xs font-mono inline-flex items-center gap-1.5 bg-zinc-800 text-zinc-100 border border-zinc-600 transition-colors"
            >
              <i data-lucide="list-music" class="w-3.5 h-3.5 text-emerald-400"></i>
              <span id="np-tab-queue-label">Queue (0)</span>
            </button>
            <button
              id="np-tab-lyrics"
              type="button"
              class="px-3 py-1.5 text-xs font-mono inline-flex items-center gap-1.5 text-zinc-400 hover:text-zinc-100 border border-transparent transition-colors"
            >
              <i data-lucide="quote" class="w-3.5 h-3.5"></i>
              <span>Lyrics</span>
            </button>
          </div>

          <button
            id="np-clear-queue-btn"
            type="button"
            title="Clear Queue"
            class="w-7 h-7 flex items-center justify-center text-zinc-400 hover:text-[#f0605a] transition-colors"
          >
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- Tab 1: Queue List -->
        <div id="np-panel-queue" class="flex-1 overflow-y-auto divide-y divide-zinc-800/60"></div>

        <!-- Tab 2: Lyrics Canvas -->
        <div id="np-panel-lyrics" class="hidden flex-1 min-h-0 flex flex-col overflow-hidden">
          <!-- Lyrics Toolbar (Mode Toggle + Lyric Search) -->
          <div class="px-3 py-2 border-b border-zinc-800 flex items-center justify-between gap-2 shrink-0">
            <div id="np-lyrics-mode-group" class="hidden items-center border border-zinc-700 bg-zinc-950">
          <button type="button" data-lyrics-toggle="romaji"
            class="lyrics-mode-btn px-2 py-0.5 text-[11px] font-mono text-zinc-400 hover:text-zinc-100">Romaji</button>
          <button type="button" data-lyrics-toggle="translated"
            class="lyrics-mode-btn px-2 py-0.5 text-[11px] font-mono text-zinc-400 hover:text-zinc-100">Translated</button>
        </div>
            <span id="np-lyrics-preparing" class="hidden text-[10px] font-mono text-emerald-400 animate-pulse">preparing readings...</span>
            <div id="np-offset-controls" class="hidden items-center gap-1 border border-zinc-700 bg-zinc-950 px-1.5 py-0.5">
              <button id="np-offset-minus" type="button" aria-label="Lyrics earlier" class="w-5 h-5 flex items-center justify-center text-zinc-400 hover:text-zinc-100 text-xs font-mono">−</button>
              <span id="np-offset-value" class="text-[11px] font-mono text-emerald-400 px-1">0.0s</span>
              <button id="np-offset-plus" type="button" aria-label="Lyrics later" class="w-5 h-5 flex items-center justify-center text-zinc-400 hover:text-zinc-100 text-xs font-mono">+</button>
              <button id="np-offset-reset" type="button" aria-label="Reset lyrics offset" class="px-1.5 h-5 flex items-center justify-center text-zinc-400 hover:text-zinc-100 text-[10px] font-mono">reset</button>
            </div>
            <button
              id="np-lyrics-search-btn"
              type="button"
              class="ml-auto px-2 py-0.5 text-[11px] font-mono text-zinc-400 hover:text-emerald-400 border border-zinc-700 bg-zinc-950 transition-colors"
            >
              lyric search
            </button>
          </div>
          <div id="np-lyrics-scroll" class="flex-1 overflow-y-auto px-4 py-6 space-y-2"></div>
        </div>
      </div>
    </div>

    <!-- Mobile / Tablet Fullscreen Layout (< lg) -->
    <div class="flex lg:hidden relative z-10 flex-col h-full w-full px-4 pt-3 pb-5 justify-between overflow-hidden">
      <!-- Top Bar -->
      <div class="flex items-center justify-between shrink-0">
        <button
          id="np-mobile-back-btn"
          type="button"
          aria-label="Minimize Now Playing"
          class="w-9 h-9 flex items-center justify-center text-zinc-300 hover:text-zinc-100"
        >
          <i data-lucide="chevron-down" class="w-5 h-5"></i>
        </button>
        <span class="text-xs font-mono uppercase tracking-wider text-zinc-400">Now Playing</span>
        <button
          id="np-mobile-more-btn"
          type="button"
          aria-label="Track Options"
          class="w-9 h-9 flex items-center justify-center text-zinc-300 hover:text-zinc-100"
        >
          <i data-lucide="more-vertical" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Center: Cover or Overlay (Queue / Lyrics) -->
      <div id="np-mobile-art-panel" class="flex-1 min-h-0 flex flex-col items-center justify-center py-4">
        <div class="relative w-full max-w-[min(300px,38dvh)] aspect-square bg-zinc-900 border border-zinc-700 overflow-hidden flex items-center justify-center shadow-2xl">
          <img id="np-mobile-cover-img" src="" alt="" class="hidden relative w-full h-full object-cover" />
          <i id="np-mobile-cover-fallback" data-lucide="disc" class="absolute inset-0 m-auto w-12 h-12 text-zinc-400 pointer-events-none"></i>
        </div>
        <div class="w-full max-w-sm mt-4 flex items-center justify-between gap-3">
          <div class="min-w-0 flex-1">
            <h2 id="np-mobile-title" class="font-display text-xl text-zinc-100 truncate">No track selected</h2>
            <p id="np-mobile-artist" class="text-xs text-zinc-400 truncate mt-0.5">-</p>
          </div>
          <button
            id="np-mobile-star-btn"
            type="button"
            class="w-9 h-9 bg-zinc-900 border border-zinc-700 flex items-center justify-center text-zinc-400 shrink-0"
          >
            <i data-lucide="star" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Mobile Overlay Panel (Lyrics or Queue) -->
      <div id="np-mobile-overlay-panel" class="hidden flex-1 min-h-0 my-3 bg-zinc-900/60 border border-zinc-700 flex flex-col overflow-hidden">
        <div class="h-10 px-3 border-b border-zinc-700 flex items-center justify-between shrink-0">
          <span id="np-mobile-overlay-title" class="text-xs font-mono uppercase tracking-wider text-zinc-200">Synced Lyrics</span>
          <div class="flex items-center gap-1.5">
            <div id="np-mobile-lyrics-mode-group" class="hidden items-center border border-zinc-700 bg-zinc-950">
          <button type="button" data-lyrics-toggle="romaji"
            class="lyrics-mode-btn px-1.5 py-0.5 text-[10px] font-mono text-zinc-400 hover:text-zinc-100">Romaji</button>
          <button type="button" data-lyrics-toggle="translated"
            class="lyrics-mode-btn px-1.5 py-0.5 text-[10px] font-mono text-zinc-400 hover:text-zinc-100">Translated</button>
        </div>
            <button id="np-mobile-overlay-close" type="button" class="p-1 text-zinc-400 hover:text-zinc-100">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div id="np-mobile-overlay-body" class="flex-1 overflow-y-auto p-3 space-y-1.5"></div>
      </div>

      <!-- Mobile Bottom Transport -->
      <div class="space-y-4 shrink-0">
        <div class="space-y-1">
          <input
            id="np-mobile-seek"
            type="range"
            min="0"
            max="100"
            step="0.1"
            value="0"
            aria-label="Seek track"
            class="studio-range w-full"
          />
          <div class="flex justify-between text-[11px] font-mono text-zinc-400">
            <span id="np-mobile-time-current">0:00</span>
            <span id="np-mobile-time-total">0:00</span>
          </div>
        </div>

        <div class="flex items-center justify-between px-2">
          <button id="np-mobile-shuffle" type="button" class="p-2 text-zinc-400 hover:text-zinc-100">
            <i data-lucide="shuffle" class="w-4 h-4"></i>
          </button>
          <button id="np-mobile-prev" type="button" class="p-2 text-zinc-100">
            <i data-lucide="skip-back" class="w-5 h-5"></i>
          </button>
          <button
            id="np-mobile-play"
            type="button"
            class="w-14 h-14 bg-emerald-400 text-zinc-950 flex items-center justify-center hover:bg-emerald-300 transition-colors"
          >
            <i id="np-mobile-play-icon" data-lucide="play" class="w-6 h-6 fill-current"></i>
          </button>
          <button id="np-mobile-next" type="button" class="p-2 text-zinc-100">
            <i data-lucide="skip-forward" class="w-5 h-5"></i>
          </button>
          <button id="np-mobile-repeat" type="button" class="p-2 text-zinc-400 hover:text-zinc-100">
            <i data-lucide="repeat" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button
            id="np-mobile-btn-queue"
            type="button"
            class="h-9 bg-zinc-900 border border-zinc-700 text-xs font-mono text-zinc-200 flex items-center justify-center gap-1.5"
          >
            <i data-lucide="list-music" class="w-3.5 h-3.5"></i>
            <span id="np-mobile-queue-label">Queue (0)</span>
          </button>
          <button
            id="np-mobile-btn-lyrics"
            type="button"
            class="h-9 bg-zinc-900 border border-zinc-700 text-xs font-mono text-zinc-200 flex items-center justify-center gap-1.5"
          >
            <i data-lucide="quote" class="w-3.5 h-3.5"></i>
            <span>Lyrics</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
