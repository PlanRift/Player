<!-- VIEW: ARTIST DETAIL (Layer 2: Artist Discography Banner, Biography, Similar Artists, Singles & Toolbar) -->
<section id="view-artist-detail" class="hidden p-6 md:p-8 pb-44 md:pb-28 space-y-6 max-w-7xl mx-auto">
  <div>
    <button
      id="back-to-artists-btn"
      type="button"
      class="inline-flex items-center gap-1.5 h-8 px-3 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 transition-colors"
    >
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>ALL ARTISTS</span>
    </button>
  </div>

  <!-- Artist Discography Banner -->
  <div id="artist-detail-header" class="studio-panel p-5 sm:p-6 flex flex-col gap-5 bg-zinc-900/60">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div class="flex items-center gap-4 min-w-0">
        <div class="w-20 h-20 sm:w-24 sm:h-24 bg-zinc-950 border border-zinc-700 shrink-0 overflow-hidden flex items-center justify-center">
          <img id="artist-detail-thumb" src="" alt="" class="w-full h-full object-cover" />
        </div>
        <div class="min-w-0">
          <p class="text-[11px] font-mono uppercase tracking-wider text-emerald-400">Layer 2 · Artist Discography</p>
          <h1 id="artist-detail-name" class="text-2xl sm:text-3xl font-display text-zinc-100 mt-1 break-words"></h1>
          <p id="artist-detail-meta" class="text-xs font-mono text-zinc-400 mt-1"></p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0 self-start sm:self-center">
        <button
          id="artist-play-all-btn"
          type="button"
          class="h-9 px-4 bg-emerald-400 hover:bg-emerald-300 text-zinc-950 text-xs font-mono font-semibold inline-flex items-center gap-2 transition-colors"
        >
          <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
          <span>PLAY</span>
        </button>
        <button
          id="artist-shuffle-btn"
          type="button"
          class="h-9 px-4 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 inline-flex items-center gap-2 transition-colors"
        >
          <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
          <span>SHUFFLE</span>
        </button>
        <button
          id="artist-star-btn"
          type="button"
          title="Star / Unstar Artist"
          class="h-9 w-9 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-400 hover:text-zinc-100 transition-colors"
        >
          <i data-lucide="star" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Artist Biography (populated from getArtistInfo2) -->
    <div id="artist-bio-wrap" class="hidden border-t border-zinc-800/80 pt-4">
      <p id="artist-bio-text" class="text-xs text-zinc-300 leading-relaxed line-clamp-4 max-w-4xl"></p>
    </div>

    <!-- Similar Artists Pills -->
    <div id="artist-similar-wrap" class="hidden border-t border-zinc-800/80 pt-4 space-y-2">
      <div class="text-[10px] font-mono uppercase tracking-wider text-zinc-400">Similar Artists</div>
      <div id="artist-similar-list" class="flex flex-wrap gap-1.5"></div>
    </div>
  </div>

  <!-- Artist Releases Grid -->
  <div id="artist-albums-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
</section>
