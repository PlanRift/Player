<!-- VIEW: ARTIST DETAIL (Layer 2: Artist Albums + Virtual Singles Card) -->
<section id="view-artist-detail" class="hidden p-6 md:p-8 space-y-6 max-w-[1440px] mx-auto">
  <div>
    <button
      id="back-to-artists-btn"
      type="button"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded bg-[#18181b] border border-[#71717a] hover:bg-[#27272a] text-xs font-mono text-[#f4f4f5] transition-colors"
    >
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>ALL ARTISTS</span>
    </button>
  </div>

  <div id="artist-detail-header" class="flex flex-col sm:flex-row items-start sm:items-end justify-between gap-4 border-b border-[#3f3f46] pb-5">
    <div>
      <div class="text-xs font-mono uppercase tracking-wider text-[#34d399]">ARTIST</div>
      <h1 id="artist-detail-name" class="text-2xl md:text-3xl font-bold tracking-tight text-[#f4f4f5] mt-1"></h1>
      <p id="artist-detail-meta" class="text-xs font-mono text-[#a1a1aa] mt-1"></p>
    </div>
    <div class="flex items-center gap-2.5">
      <button
        id="artist-play-all-btn"
        type="button"
        class="px-4 py-2 rounded bg-[#34d399] text-[#090d0b] text-xs font-mono font-semibold flex items-center gap-2 hover:opacity-90 transition-opacity"
      >
        <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
        <span>PLAY ARTIST</span>
      </button>
      <button
        id="artist-shuffle-btn"
        type="button"
        class="px-4 py-2 rounded bg-[#18181b] border border-[#71717a] hover:bg-[#27272a] text-xs font-mono text-[#f4f4f5] flex items-center gap-2 transition-colors"
      >
        <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
        <span>SHUFFLE</span>
      </button>
    </div>
  </div>

  <div id="artist-albums-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
</section>
