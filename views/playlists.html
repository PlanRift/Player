<!-- VIEW: ALL PLAYLISTS -->
<section id="view-playlists" class="hidden p-6 md:p-8 space-y-6 max-w-[1440px] mx-auto">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[#3f3f46] pb-4">
    <div>
      <h1 class="text-xl font-semibold tracking-tight text-[#f4f4f5]">Playlists</h1>
      <p id="playlists-count-label" class="text-xs font-mono text-[#a1a1aa] mt-0.5">Custom server playlists with 2x2 collage covers</p>
    </div>
    <form id="playlists-create-form" class="flex items-center gap-2">
      <input
        id="playlists-create-input"
        type="text"
        placeholder="New playlist title..."
        aria-label="New playlist title"
        class="px-3 py-1.5 rounded bg-[#18181b] border border-[#71717a] text-xs text-[#f4f4f5] placeholder-[#a1a1aa]"
      />
      <button
        type="submit"
        class="px-3.5 py-1.5 rounded bg-[#34d399] text-[#090d0b] text-xs font-mono font-semibold hover:opacity-90 transition-opacity"
      >
        + CREATE
      </button>
    </form>
  </div>

  <div id="playlists-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
</section>
