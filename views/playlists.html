<!-- VIEW: ALL PLAYLISTS (Horizontal Row MediaCards with 2x2 Canvas Collages) -->
<section id="view-playlists" class="hidden p-6 md:p-8 pb-44 md:pb-28 space-y-6 max-w-7xl mx-auto">
  <!-- Section Header -->
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 pb-4 border-b border-zinc-700">
    <div>
      <h1 class="font-display font-normal text-2xl sm:text-3xl tracking-tight text-zinc-100 leading-none">Playlists</h1>
      <p id="playlists-count-label" class="font-mono text-xs text-zinc-400 tracking-wide mt-2">Custom playlists</p>
    </div>
    <div class="flex items-center gap-2 self-start sm:self-auto">
      <button
        id="playlists-open-create-modal-btn"
        type="button"
        class="h-8 px-3.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 inline-flex items-center gap-1.5 transition-colors"
      >
        <i data-lucide="plus" class="w-3.5 h-3.5 text-emerald-400"></i>
        <span>CREATE PLAYLIST</span>
      </button>
    </div>
  </div>

  <!-- Horizontal Row Cards Grid -->
  <div id="playlists-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</section>
