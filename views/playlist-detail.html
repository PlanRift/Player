<!-- VIEW: PLAYLIST DETAIL -->
<section id="view-playlist-detail" class="hidden p-6 md:p-8 space-y-6 max-w-[1440px] mx-auto">
  <div>
    <button
      id="playlist-back-btn"
      type="button"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded bg-[#18181b] border border-[#71717a] hover:bg-[#27272a] text-xs font-mono text-[#f4f4f5] transition-colors"
    >
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>ALL PLAYLISTS</span>
    </button>
  </div>

  <div class="flex flex-col md:flex-row gap-6 items-start md:items-end border-b border-[#3f3f46] pb-6">
    <div class="w-40 h-40 md:w-44 md:h-44 rounded-lg bg-[#18181b] border border-[#3f3f46] overflow-hidden shrink-0 flex items-center justify-center">
      <img id="playlist-detail-cover" src="" alt="" class="hidden w-full h-full object-cover" />
      <div id="playlist-detail-cover-fallback" class="flex flex-col items-center justify-center text-[#a1a1aa]">
        <i data-lucide="list-music" class="w-10 h-10 mb-1"></i>
        <span class="text-[10px] font-mono">PLAYLIST</span>
      </div>
    </div>

    <div class="flex-1 min-w-0 space-y-2">
      <div class="text-xs font-mono uppercase tracking-wider text-[#34d399]">PLAYLIST</div>
      <div class="flex items-center gap-2 flex-wrap">
        <h1 id="playlist-detail-title" class="text-2xl md:text-3xl font-bold tracking-tight text-[#f4f4f5]"></h1>
        <button
          id="playlist-rename-toggle-btn"
          type="button"
          aria-label="Rename playlist"
          title="Rename playlist"
          class="p-1.5 rounded bg-[#18181b] border border-[#71717a] text-[#a1a1aa] hover:text-[#f4f4f5]"
        >
          <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <form id="playlist-rename-form" class="hidden items-center gap-2 pt-1">
        <input
          id="playlist-rename-input"
          type="text"
          aria-label="Playlist new name"
          class="px-3 py-1.5 rounded bg-[#18181b] border border-[#71717a] text-xs text-[#f4f4f5]"
        />
        <button
          type="submit"
          class="px-3 py-1.5 rounded bg-[#34d399] text-[#090d0b] text-xs font-mono font-semibold"
        >
          SAVE
        </button>
        <button
          id="playlist-rename-cancel-btn"
          type="button"
          class="px-3 py-1.5 rounded bg-[#27272a] border border-[#71717a] text-xs font-mono text-[#f4f4f5]"
        >
          CANCEL
        </button>
      </form>

      <p id="playlist-detail-meta" class="text-xs font-mono text-[#a1a1aa]"></p>

      <div class="pt-3 flex flex-wrap items-center gap-2.5">
        <button
          id="playlist-play-btn"
          type="button"
          class="px-4 py-2 rounded bg-[#34d399] text-[#090d0b] text-xs font-mono font-semibold flex items-center gap-2 hover:opacity-90 transition-opacity"
        >
          <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
          <span>PLAY</span>
        </button>
        <button
          id="playlist-shuffle-btn"
          type="button"
          class="px-4 py-2 rounded bg-[#18181b] border border-[#71717a] hover:bg-[#27272a] text-xs font-mono text-[#f4f4f5] flex items-center gap-2 transition-colors"
        >
          <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
          <span>SHUFFLE</span>
        </button>
        <button
          id="playlist-delete-btn"
          type="button"
          class="px-3.5 py-2 rounded bg-[#18181b] border border-[#71717a] hover:border-[#f87171] text-xs font-mono text-[#f87171] flex items-center gap-1.5 transition-colors"
        >
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          <span id="playlist-delete-label">DELETE PLAYLIST</span>
        </button>
      </div>
    </div>
  </div>

  <div id="playlist-tracks-list" class="divide-y divide-[#3f3f46] border border-[#3f3f46] rounded-lg bg-[#18181b] overflow-hidden"></div>
</section>
