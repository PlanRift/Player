<!-- VIEW: FAVOURITE SONGS -->
<section id="view-favourites" class="hidden p-6 md:p-8 pb-44 md:pb-28 space-y-6 max-w-7xl mx-auto">
  <!-- Section Header -->
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 pb-4 border-b border-zinc-700">
    <div>
      <h1 class="font-display font-normal text-2xl sm:text-3xl tracking-tight text-zinc-100 leading-none">Favourite Songs</h1>
      <p id="favourites-count-label" class="font-mono text-xs text-zinc-400 tracking-wide mt-2">Starred tracks from Navidrome</p>
    </div>
    <div class="flex items-center gap-2 self-start sm:self-auto">
      <button
        id="favourites-play-btn"
        type="button"
        class="h-8 px-3.5 bg-emerald-400 hover:bg-emerald-300 text-zinc-950 text-xs font-mono font-semibold inline-flex items-center gap-1.5 transition-colors"
      >
        <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
        <span>PLAY ALL</span>
      </button>
      <button
        id="favourites-shuffle-btn"
        type="button"
        class="h-8 px-3.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-mono text-zinc-200 inline-flex items-center gap-1.5 transition-colors"
      >
        <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
        <span>SHUFFLE</span>
      </button>
    </div>
  </div>

  <div id="favourites-list" class="studio-panel divide-y divide-zinc-800/60 overflow-hidden"></div>
</section>
