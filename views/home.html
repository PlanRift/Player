<!-- VIEW: HOME (Discovery Mixes + Recently Added Albums) -->
<section id="view-home" class="p-6 md:p-8 space-y-10 max-w-[1440px] mx-auto">
  <!-- Discovery Section -->
  <div>
    <div class="flex items-baseline justify-between mb-4 border-b border-[#3f3f46] pb-3">
      <div>
        <h1 class="text-xl font-semibold tracking-tight text-[#f4f4f5]">Made For You</h1>
        <p class="text-xs font-mono text-[#a1a1aa] mt-0.5">
          Dynamic studio mixes synthesized from your Navidrome library and listening history
        </p>
      </div>
      <button
        id="home-refresh-btn"
        type="button"
        class="px-3 py-1.5 rounded bg-[#18181b] border border-[#71717a] hover:bg-[#27272a] text-xs font-mono text-[#f4f4f5] flex items-center gap-1.5 transition-colors"
      >
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        <span>REFRESH</span>
      </button>
    </div>
    <div id="discovery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"></div>
  </div>

  <!-- Recently Added Albums Section -->
  <div>
    <div class="flex items-baseline justify-between mb-4 border-b border-[#3f3f46] pb-3">
      <div>
        <h2 class="text-lg font-semibold tracking-tight text-[#f4f4f5]">Recently Added</h2>
        <p class="text-xs font-mono text-[#a1a1aa] mt-0.5">Latest album additions to your server</p>
      </div>
      <button
        id="home-see-all-albums-btn"
        type="button"
        class="text-xs font-mono text-[#34d399] hover:underline"
      >
        VIEW ALL ALBUMS
      </button>
    </div>
    <div id="home-recent-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
  </div>
</section>
